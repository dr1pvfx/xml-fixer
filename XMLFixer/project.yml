name: XMLFixer
options:
  bundleIdPrefix: com.xmlfixer
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  XMLFixer:
    type: application
    platform: macOS
    sources:
      - path: XMLFixer
    settings:
      base:
        INFOPLIST_FILE: XMLFixer/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xmlfixer.XMLFixer
        PRODUCT_NAME: RPB XML Toolkit
        PRODUCT_MODULE_NAME: XML_Fixer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: XMLFixer/XMLFixer.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: XMLFixer/App/Info.plist
      properties:
        CFBundleName: RPB XML Toolkit
        CFBundleDisplayName: RPB XML Toolkit
        CFBundleIdentifier: com.xmlfixer.XMLFixer
        CFBundleVersion: "12"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "14.0"
        NSMainStoryboardFile: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: XML Document
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - public.xml
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
  XMLFixerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XMLFixerTests
    dependencies:
      - target: XMLFixer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xmlfixer.XMLFixerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RPB XML Toolkit.app/Contents/MacOS/RPB XML Toolkit"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  XMLFixer:
    build:
      targets:
        XMLFixer: all
        XMLFixerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XMLFixerTests
    archive:
      config: Release
